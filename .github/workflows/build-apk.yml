
name: Build VEER Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - veer-fixed-source

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore release keystore
        env:
          VEER_RELEASE_KEY_BASE64: ${{ secrets.VEER_RELEASE_KEY_BASE64 }}
        run: |
          echo "$VEER_RELEASE_KEY_BASE64" | base64 --decode > android/app/veer-release-key.jks

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Release APK
        env:
          VEER_KEYSTORE_PASSWORD: ${{ secrets.VEER_KEYSTORE_PASSWORD }}
          VEER_KEY_ALIAS: ${{ secrets.VEER_KEY_ALIAS }}
          VEER_KEY_PASSWORD: ${{ secrets.VEER_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VEER-Android-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          
